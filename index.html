<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>傳說對決 2025 AIC 小組賽排名分析 - 小律版</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #111827;
      color: #e5e7eb;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-width: 900px;
      margin: 0 auto 20px auto;
      border: 1px solid #1f2937;
    }
    label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
      color: #9ca3af;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      background: #020617;
      color: #e5e7eb;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 8px;
      font-family: "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      box-sizing: border-box;
      resize: vertical;
    }
    input, select {
      background: #020617;
      color: #e5e7eb;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 6px 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus, textarea:focus, select:focus {
      outline: 1px solid #3b82f6;
      border-color: #3b82f6;
    }
    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
      margin-bottom: 8px;
    }
    .row > div {
      flex: 1;
      min-width: 160px;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: #3b82f6;
      color: white;
      transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.1s ease;
    }
    button:hover {
      background: #2563eb;
      box-shadow: 0 10px 20px rgba(37,99,235,0.35);
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(0);
      box-shadow: none;
    }
    pre {
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 10px;
      white-space: pre-wrap;
      max-height: 500px;
      overflow: auto;
      font-family: "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>傳說對決 2025 AIC 小組賽排名分析程式（網頁版）</h1>
    <div class="hint">
      輸入格式：<br/>
      已對戰：<code>ONE 2 0 BAC</code><br/>
      未對戰：<code>FW 0 0 SPN</code>
    </div>
    <label for="input">請輸入目前小組所有對戰結果（每行一筆）：</label>
    <textarea id="input" placeholder="例如：
ONE 2 0 BAC
HKA 0 0 BRU
..."></textarea>

    <div class="row">
      <div>
        <label for="team">查詢隊伍（不查請留空）：</label>
        <input id="team" type="text" placeholder="例如：HKA" />
      </div>
      <div>
        <label for="query">查詢種類：</label>
        <select id="query">
          <option value="no">不查詢</option>
          <option value="up8">會進八強的可能 (up8)</option>
          <option value="no_up8">不會進八強的可能 (no_up8)</option>
        </select>
      </div>
    </div>

    <button id="runBtn">開始計算</button>
    <div class="hint">
      注意：如果未來未打的比賽太多，組合數會呈 4^N 成長，可能會跑比較久。
    </div>
  </div>

  <div class="card">
    <h1>結果輸出</h1>
    <pre id="output"></pre>
  </div>

  <script>
    class ST {
      constructor(name) {
        this.my_team = name;
        this.mp = {};
        this.big_win = 0;
        this.big_lose = 0;
        this.small_win = 0;
        this.small_lose = 0;
        this.dif = 0;
        this.same = 0;
        this.rank = 1;
      }
    }

    function cloneTeamMap(teamMap) {
      const newMap = new Map();
      for (const [name, t] of teamMap.entries()) {
        const nt = new ST(name);
        const tmp = JSON.parse(JSON.stringify(t));
        Object.assign(nt, tmp);
        newMap.set(name, nt);
      }
      return newMap;
    }

    function record(teamMap, s, s2, a, b) {
      if (!teamMap.has(s)) teamMap.set(s, new ST(s));
      if (!teamMap.has(s2)) teamMap.set(s2, new ST(s2));
      const t1 = teamMap.get(s);
      const t2 = teamMap.get(s2);

      t1.small_win += a;
      t1.small_lose += b;
      t2.small_win += b;
      t2.small_lose += a;

      t1.dif = t1.small_win - t1.small_lose;
      t2.dif = t2.small_win - t2.small_lose;

      if (!t1.mp[s2]) t1.mp[s2] = 0;
      if (!t2.mp[s])  t2.mp[s]  = 0;
      t1.mp[s2] += a;
      t2.mp[s]  += b;

      if (a > b) {
        t1.big_win++;
        t2.big_lose++;
      } else if (a < b) {
        t2.big_win++;
        t1.big_lose++;
      }
    }

    function cmp(a, b) {
      if (a.big_win !== b.big_win) return b.big_win - a.big_win;
      if (a.dif !== b.dif)         return b.dif - a.dif;

      const ab = a.mp[b.my_team] || 0;
      const ba = b.mp[a.my_team] || 0;
      if (ab !== ba) return ba - ab;

      return a.my_team.localeCompare(b.my_team);
    }

    function print(teamMap, possible, find_team, up8, no_up8, state) {
      let v = Array.from(teamMap.values()).map(t => {
        const nt = new ST(t.my_team);
        Object.assign(nt, JSON.parse(JSON.stringify(t)));
        return nt;
      });

      v.sort(cmp);

      let group_id = 0;
      for (let i = 0; i < v.length; i++) {
        if (i === 0) {
          v[i].same = ++group_id;
        } else {
          let same_group = true;
          if (v[i].big_win !== v[i-1].big_win) same_group = false;
          if (v[i].dif     !== v[i-1].dif)     same_group = false;
          const ab = v[i].mp[v[i-1].my_team] || 0;
          const ba = v[i-1].mp[v[i].my_team] || 0;
          if (ab !== ba) same_group = false;

          if (same_group) v[i].same = group_id;
          else            v[i].same = ++group_id;
        }
      }

      const rk = [];
      for (let i = 0; i < v.length; i++) rk[i] = i + 1;
      if (v.length > 0) v[0].rank = 1;
      for (let i = 1; i < v.length; i++) {
        if (v[i].same === v[i-1].same && v[i].same) rk[i] = rk[i-1];
        v[i].rank = rk[i];
      }

      let go_to_print = false;
      if (find_team === "no" || !find_team) go_to_print = true;

      if (up8) {
        for (const i of v) {
          if (i.my_team === find_team && i.rank <= 4) go_to_print = true;
        }
      }

      if (no_up8) {
        for (const i of v) {
          if (i.my_team === find_team && i.rank >= 5) go_to_print = true;
        }
        for (let i = 0; i < v.length; i++) {
          if (v[i].my_team === find_team && i !== v.length - 1 &&
              v[i].rank === 4 && v[i+1].rank === 4) go_to_print = true;
        }
        for (let i = 1; i < v.length; i++) {
          if (v[i].my_team === find_team && v[i].rank === 4 &&
              v[i-1].rank === 4) go_to_print = true;
        }
      }

      if (go_to_print) {
        state.check_find_out = true;
        state.ans++;
        if (possible.length > 0) {
          state.out += possible.join("\n") + "\n";
        }
        state.out += "排名 隊伍 大分 敗 小分 敗 勝差\n";
        for (const i of v) {
          state.out += `${i.rank} ${i.my_team} ${i.big_win} ${i.big_lose} ${i.small_win} ${i.small_lose} ${i.dif}\n`;
        }
        state.out += "\n";
      }
    }

    function dfs(teamMap, games, now, possible, find_team, up8, no_up8, state) {
      if (now === games.length) {
        print(teamMap, possible, find_team, up8, no_up8, state);
        return;
      }

      const [s, s2] = games[now];
      const results = [
        [2, 0],
        [2, 1],
        [1, 2],
        [0, 2]
      ];
      const labels = ["2 : 0", "2 : 1", "1 : 2", "0 : 2"];

      for (let idx = 0; idx < 4; idx++) {
        const [a, b] = results[idx];
        const newMap = cloneTeamMap(teamMap);
        record(newMap, s, s2, a, b);

        const nextPossible = possible.slice();
        nextPossible.push(`${s} ${labels[idx]} ${s2}`);

        dfs(newMap, games, now + 1, nextPossible, find_team, up8, no_up8, state);
      }
    }

    document.getElementById("runBtn").addEventListener("click", () => {
      const input = document.getElementById("input").value.trim();
      const find_team_raw = document.getElementById("team").value.trim();
      const query = document.getElementById("query").value;

      const find_team = find_team_raw === "" ? "no" : find_team_raw;
      const up8 = query === "up8";
      const no_up8 = query === "no_up8";

      const lines = input.split(/\n+/);
      const teamMap = new Map();
      const games = [];

      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = line.trim().split(/\s+/);
        if (parts.length < 4) continue;

        const s = parts[0];
        const a = parseInt(parts[1], 10);
        const b = parseInt(parts[2], 10);
        const s2 = parts[3];

        if (a || b) {
          record(teamMap, s, s2, a, b);
        } else {
          games.push([s, s2]);
        }
      }

      const state = {
        out: "",
        check_find_out: false,
        ans: 0
      };

      const start = ["目前 AIC 2025 小組賽成績"];
      print(teamMap, start, "no", false, false, state);

      dfs(teamMap, games, 0, [], find_team, up8, no_up8, state);

      if (!state.check_find_out && find_team !== "no") {
        state.out += find_team + " 確定";
        if (up8) state.out += "被淘汰\n";
        if (no_up8) state.out += "晉級八強賽\n";
      }

      document.getElementById("output").textContent = state.out || "沒有輸出（請確認輸入格式正確）";
    });
  </script>
</body>
</html>
